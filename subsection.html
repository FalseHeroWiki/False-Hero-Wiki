<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bosses - Game Wiki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header & Centered Logo -->
  <header class="wiki-header">
    <a href="index.html">
      <img class="wiki-logo" src="Assets/MainMenuLogoV2.png" alt="Game Logo">
    </a>

    <!-- Top Navigation -->
    <nav class="wiki-nav">
      <a href="index.html" class="wiki-btn">HOME</a>
      <a href="subsection.html" class="wiki-btn active">BOSSES</a>
      <a href="template.html" class="wiki-btn">ITEMS</a>
    </nav>

    <hr class="line-divider-h">

    <h1 class="page-title">BOSSES & ENCOUNTERS</h1>
    <p class="page-subtitle">Select an encounter below to inspect combat patterns, stats, and drop tables.</p>
  </header>

  <!-- Subsection Item / Boss List -->
  <main class="subsection-grid">

    <!-- Card 1: Default Item/Boss -->
    <a href="template.html" class="item-card">
      <span class="item-name">IRON GOLEM</span>
      <div class="item-circle-socket">
        <img src="Assets/ArmorButton02_Default.png" alt="Iron Golem">
      </div>
    </a>

    <!-- Card 2 -->
    <a href="template.html" class="item-card">
      <span class="item-name">SHADOW KNIGHT</span>
      <div class="item-circle-socket">
        <img src="Assets/Container.png" alt="Shadow Knight">
      </div>
    </a>

    <!-- Card 3 -->
    <a href="template.html" class="item-card">
      <span class="item-name">VOID WALKER</span>
      <div class="item-circle-socket">
        <img src="Assets/ArmorButton02_Default.png" alt="Void Walker">
      </div>
    </a>

    <!-- Card 4: Optional Locked / Hidden Entry -->
    <a href="#" class="item-card locked">
      <span class="item-name">??? (LOCKED)</span>
      <div class="item-circle-socket">
        <img src="Assets/Container.png" alt="Locked">
      </div>
    </a>

  </main>

</body>
</html>
